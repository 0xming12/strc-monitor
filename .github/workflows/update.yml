name: 更新 STRC 监控数据

on:
  schedule:
    # 计划每 15 分钟一次（UTC），避开整点和半点：那是 GitHub 定时任务最拥挤的时候，容易被推迟或跳过。
    # GitHub 不保证准时，繁忙时可能隔几个小时才跑一次。
    - cron: "7,22,37,52 * * * *"
  push:                      # 脚本或定时任务有改动、合并到 main 时马上跑一次（后台自己提交的 data/ 不会触发）
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}      # 也可以在 Actions 页面手动运行

permissions:
  contents: write   # 把 data/ 的更新提交回仓库（推送后 GitHub Pages 会自动重新构建）
  issues: write     # 出现新信号时开 Issue 提醒

concurrency:
  group: strc-monitor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 用 main 的最新提交。排队等待的运行如果用触发时的旧提交，会拿到旧的提醒记录，重复开 Issue
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 读取 SEC 文件和行情，生成 data/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT || vars.SEC_CONTACT }}
        run: python scripts/update.py

      - name: 有变化时提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "更新监控数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
